# ===================================================================
# Experiment: Single-DC, Single-Agent (Local Scheduler Only) with SWF
# - No multi-agent RL
# - No hierarchical scheduling
# - Uses SB3 training entrypoint (drl-manager/entrypoint.py -> src.training.train_single_dc)
# ===================================================================
experiment_single_dc_local_swf:
  simulation_name: "Exp_SingleDC_SWF_LocalAgent"
  experiment_name: "exp_single_dc_swf_local"
  experiment_type_dir: "SWF_SingleDC"

  # Explicitly disable multi-DC / MARL pipelines
  multi_datacenter_enabled: false

  # Use the single-agent Gymnasium environment
  env_id: "LoadBalancingScaling-v0"

  # Datacenter configuration (picked from experiment_multi_dc_10: DC_Edge_West style)
  # Flattened into single-DC keys (single-DC mode does not read `datacenters:` list).
  enable_heterogeneous_hosts: true
  hosts_count: 6
  host_count_spec_acer_ar360: 6

  # Keep these aligned with the chosen SPEC profile (Acer AR360 F2: 16 cores, 50k MIPS)
  host_pes: 16
  host_pe_mips: 50000

  # VM configuration (Edge DC - smaller VMs)
  small_vm_pes: 2
  small_vm_ram: 4096
  small_vm_bw: 500
  small_vm_storage: 2000
  medium_vm_multiplier: 2
  large_vm_multiplier: 4

  # Initial VM Fleet (Edge DC)
  initial_s_vm_count: 10
  initial_m_vm_count: 4
  initial_l_vm_count: 2

  # Green energy (match the chosen edge DC turbine)
  green_energy:
    enabled: true
    turbine_id: 105
    wind_data_file: "windProduction/simplified"
    prediction:
      enabled: false

  # Reward weights (explicit for this experiment)
  # NOTE: Single-DC Java reward currently uses ONLY:
  # - reward_wait_time_coef
  # - reward_unutilization_coef
  # - reward_queue_penalty_coef
  # - reward_invalid_action_coef
  # Throughput/cost/energy coefficients may exist in config but are not used by the single-DC reward function.
  reward_wait_time_coef: 0.75
  reward_unutilization_coef: 0.25
  reward_queue_penalty_coef: 0.55
  reward_invalid_action_coef: 1.0

  # Workload: SWF trace (submit times start at 0 in this test file)
  workload_mode: "SWF"
  # Use a real HPC trace but map it to "cloud scale" so it is learnable:
  # - compress submit times into the episode range
  # - cap processor requests to max_cloudlet_pes (otherwise jobs request 128+ PEs)
  # - scale MI by PEs to keep runtime consistent after capping
  cloudlet_trace_file: "traces/NASA-iPSC-1993-3.1-cln.swf"
  swf_filter_failed_jobs: true
  swf_normalize_submit_times: true
  swf_time_scale: 500.0
  swf_max_pes: 8
  swf_scale_mi_by_pes: true

  max_cloudlets_to_create_from_workload_file: 5000
  workload_reader_mips: 50000
  # With swf_max_pes capped to 8, splitting is not needed and can create too many similar tasks.
  split_large_cloudlets: false
  max_cloudlet_pes: 8

  # Training (single agent)
  mode: "train"
  algorithm: "MaskablePPO"
  timesteps: 50000
  learning_rate: 0.0003

  # Episode length (seconds/steps). Increase if you want more tasks to finish.
  max_episode_length: 2000

  # PPO hyperparameters (reasonable defaults)
  n_steps: 1024
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

  # Keep logging on for reproducibility
  seed: 42
  save_experiment: true
  device: "auto"
  verbose: 1
  log_interval: 1

# ===================================================================
# Experiment: Single-DC, Single-Agent (Local Scheduler Only) with CSV
# - Recommended for quick sanity checks and stable learning curves
# ===================================================================
experiment_single_dc_local_csv:
  simulation_name: "Exp_SingleDC_CSV_LocalAgent"
  experiment_name: "exp_single_dc_csv_local"
  experiment_type_dir: "CSV_SingleDC"

  multi_datacenter_enabled: false
  env_id: "LoadBalancingScaling-v0"
  device: "cuda"

  # Reuse ONE datacenter from experiment_multi_dc_10 (datacenters[0]).
  # Single-DC Java will read datacenters[0] and map it into single-DC settings.
  datacenters:
    - datacenter_id: 0
      name: "DC_Premium_West"
      turbine_ids: [1]
      wind_data_file: "windProduction/simplified"
      green_energy_enabled: true
      time_scaling_mode: "COMPRESSED"
      time_zone_offset_rows: 0
      brown_carbon_factor: 0.7
      green_carbon_factor: 0.01

      # Single host type: RS700A (128 cores, 512GB RAM, 40Gbps BW per host)
      host_count_spec_asus_rs700a: 20
      hosts_count: 20

      small_vm_pes: 2
      small_vm_ram: 8192
      small_vm_bw: 1000
      small_vm_storage: 4000
      medium_vm_multiplier: 2
      large_vm_multiplier: 4

      initial_s_vm_count: 128
      initial_m_vm_count: 64
      initial_l_vm_count: 32
      vm_startup_delay: 0.0
      vm_shutdown_delay: 0.0

  # Datacenter config 
  # Enable heterogeneous datacenter with exact benchmark data
  enable_heterogeneous_hosts: true

  # Real server distribution (total: 28 hosts)
  # Using actual SPEC power_ssj2008 benchmark data from ASUSTeK and Acer:

  host_count_spec_acer_r520: 6        # Acer Altos R520 (Legacy)
                                       # - Intel Xeon E5450, 8 cores, 16GB RAM
                                       # - Idle: 155W, Peak: 269W (57.6% idle!)
                                       # - Very inefficient, legacy workloads only
                                       # - Realistic: old servers still in production

  host_count_spec_acer_ar360: 6       # Acer AR360 F2 (Medium Older)
                                       # - Intel Xeon E5-2660, 16 cores, 32GB RAM
                                       # - Idle: 69.4W, Peak: 315W (22.0% idle)
                                       # - Transition-era efficiency

  host_count_spec_asus_rs720_e9: 8    # ASUSTeK RS720-E9/RS8 (Modern Efficient)
                                       # - Intel Xeon Platinum 8180, 56 cores, 128GB RAM
                                       # - Idle: 48.2W, Peak: 385W (12.5% idle) ⚡
                                       # - HIGHLY EFFICIENT: Best idle power ratio
                                       # - Primary workhorse servers

  host_count_spec_asus_rs500a: 8      # ASUSTeK RS500A-E10-PS4 (Large AMD EPYC)
                                       # - AMD EPYC 7742, 64 cores, 256GB RAM
                                       # - Idle: 51.4W, Peak: 214W (24.0% idle)
                                       # - EXTREMELY POWER EFFICIENT: Lowest peak power
                                       # - 64 cores with only 214W peak!

  host_count_spec_asus_rs700a: 2      # ASUSTeK RS700A-E9-RS4V2 (Ultra Dual-Socket)
                                       # - AMD EPYC 7742 x2, 128 cores, 512GB RAM
                                       # - Idle: 106W, Peak: 430W (24.7% idle)
                                       # - Massive capacity for peak loads

  hosts_count: 28                      # Total (4+6+8+8+2 = 28 hosts)

  # --- VM Fleet (Optimized for SPEC server capacities) ---
  initial_s_vm_count: 30              # Small VMs for light tasks
  initial_m_vm_count: 15               # Medium VMs for balanced workloads
  initial_l_vm_count: 10               # Large VMs for heavy computation


  green_energy:
    enabled: true
    turbine_ids: [1]
    turbine_id: 1
    wind_data_file: "windProduction/simplified"
    time_scaling_mode: "COMPRESSED"
    time_zone_offset_rows: 0
    brown_carbon_factor: 0.7
    green_carbon_factor: 0.01
    prediction:
      enabled: false

  # Reward weights (same defaults; keep explicit for clarity)
  reward_wait_time_coef: 0.75
  reward_unutilization_coef: 0.25
  reward_queue_penalty_coef: 0.55
  reward_invalid_action_coef: 1.0

  # Workload: CSV (already in repo, reasonable arrival times / PEs 1-8)
  workload_mode: "CSV"
  cloudlet_trace_file: "traces/single_dc_2000_poisson.csv"
  # Keep cloudlets as-is (no splitting needed for this file)
  split_large_cloudlets: false
  max_cloudlet_pes: 8
  # workload_reader_mips is ignored for CSV, but harmless if present via common defaults

  # Training
  mode: "train"
  algorithm: "MaskablePPO"
  timesteps: 400000
  learning_rate: 0.0003
  max_episode_length: 4000

  n_steps: 1024
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5

  seed: 42
  save_experiment: true
  device: "auto"
  verbose: 1
  log_interval: 1



experiment_multi_dc_10:
  # --- Identification ---
  simulation_name: "Hierarchical_10DC_Green"
  experiment_name: "hierarchical_10dc"
  experiment_type_dir: "Multi_Datacenter"

  # --- Multi-Datacenter Configuration ---
  multi_datacenter_enabled: true
  py4j_port: 25333                    # Same port as Java gateway

  # Global Routing Configuration
  global_routing_batch_size: 10       # Increased batch size for 10 DCs

  # --- Datacenter Configurations ---
  # ========================================================================
  # SINGLE HOST TYPE PER DC - Simplified for better resource management
  # Each DC uses ONE host profile to avoid fragmentation and ensure
  # predictable VM allocation. VM counts calculated to stay within:
  # - Core capacity (70% utilization target)
  # - Bandwidth capacity (95% utilization max)
  # - RAM capacity (80% utilization target)
  # ========================================================================
  datacenters:
    # ===============================
    # Tier 1: Premium DCs (RS700A - 128 cores, 512GB RAM, 40Gbps BW)
    # ===============================

    # Datacenter 0: Premium High-Performance (US West)
    # Host: SPEC_ASUS_RS700A - AMD EPYC 7742 x2 (128 cores, 512GB, 40Gbps)
    # 80 hosts × 128 cores = 10,240 total cores
    # VM allocation: 640 small + 320 medium + 160 large = 1120 VMs
    # Core usage: 640×2 + 320×4 + 160×8 = 3,840 cores (38%)
    # RAM/BW well under limits, no fragmentation risk
    - datacenter_id: 0
      name: "DC_Premium_West"
      turbine_ids: [1]
      wind_data_file: "windProduction/simplified"
      green_energy_enabled: true
      time_scaling_mode: "COMPRESSED"
      time_zone_offset_rows: 0            # Baseline (PST) - 0 hours offset
      brown_carbon_factor: 0.7
      green_carbon_factor: 0.01

      # Single host type: RS700A (128 cores, 512GB RAM, 40Gbps BW per host)
      # SCALED DOWN 10x for faster simulation
      host_count_spec_asus_rs700a: 20

      small_vm_pes: 2
      small_vm_ram: 8192
      small_vm_bw: 1000
      small_vm_storage: 4000
      medium_vm_multiplier: 2
      large_vm_multiplier: 4

      # VM counts moderately scaled up to increase utilization (was 64/32/16)
      initial_s_vm_count: 128
      initial_m_vm_count: 64
      initial_l_vm_count: 32
      vm_startup_delay: 0.0
      vm_shutdown_delay: 0.0

    # Datacenter 1: Premium High-Performance (US East)
    # Host: SPEC_ASUS_RS700A - AMD EPYC 7742 x2 (128 cores, 512GB, 40Gbps)
    # 60 hosts × 128 cores = 7,680 total cores
    # VM allocation: 480 small + 240 medium + 120 large = 840 VMs
    # Core usage: 480×2 + 240×4 + 120×8 = 2,880 cores (38%)
    - datacenter_id: 1
      name: "DC_Premium_East"
      turbine_ids: [15]
      wind_data_file: "windProduction/simplified"
      green_energy_enabled: true
      time_scaling_mode: "COMPRESSED"
      time_zone_offset_rows: 18           # +3 hours (EST) - 18 rows × 10min = 3 hours
      brown_carbon_factor: 0.65
      green_carbon_factor: 0.01

      # Single host type: RS700A (128 cores, 512GB RAM, 40Gbps BW per host)
      # SCALED DOWN 10x for faster simulation
      host_count_spec_asus_rs700a: 16

      small_vm_pes: 2
      small_vm_ram: 8192
      small_vm_bw: 1000
      small_vm_storage: 4000
      medium_vm_multiplier: 2
      large_vm_multiplier: 4

      # VM counts moderately scaled up to increase utilization (was 48/24/12)
      initial_s_vm_count: 96
      initial_m_vm_count: 48
      initial_l_vm_count: 24
      vm_startup_delay: 0.0
      vm_shutdown_delay: 0.0

    # ===============================
