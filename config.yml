  workload_reader_mips: 50000
  split_large_cloudlets: true
  max_cloudlet_pes: 8

  # --- Simulation Settings ---
  simulation_timestep: 1.0
  min_time_between_events: 0.1
  max_episode_length: 4000  # Reduced from 10000 (faster cloudlets complete sooner)

  # --- Reward Configuration ---
  reward_completion_coef: 0.3            # Slightly higher completion reward

  # NEW Global Reward Scheme: r_global = α·L - β·Ĉ - γ·R_w
  # - L = Average local reward
  # - Ĉ = Running-max normalized carbon (0~3)
  # - R_w = Green waste ratio (0~1)
  global_reward_alpha: 1.0    # α: Local performance weight
  global_reward_beta: 1.5     # β: Carbon penalty weight
  global_reward_gamma: 0.5    # γ: Green waste penalty weight

  # Local reward weights (used by Java)
  reward_wait_time_coef: 1.0
  reward_unutilization_coef: 1.0
  reward_queue_penalty_coef: 0.6
  reward_invalid_action_coef: 2.0

  # --- Global Agent Configuration ---
  global_model:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95

  # --- Local Model Configuration ---
  local_model:
    learning_rate: 0.0003
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    vf_coef: 0.5
    max_grad_norm: 0.5

  # --- Training Configuration (RLlib) ---
  training:
    algorithm: "PPO"       # Explicitly use PPO for RLlib
    total_timesteps: 500000 # More timesteps for 10 DCs
    num_workers: 0
    num_gpus: 1
    train_batch_size: 8000            # Larger batch for more agents
    sgd_minibatch_size: 256
    num_sgd_iter: 10
    checkpoint_freq_timesteps: 20000
    # Enable local-agent parameter sharing in RLlib (shared_local_policy)
    parameter_sharing: true

